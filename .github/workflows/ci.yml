name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: build & test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore FerroliteStudio.slnx --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build FerroliteStudio.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test Ferrolite.Core.Tests
          --no-build
          --configuration Release
          --filter "Category!=Hardware"
